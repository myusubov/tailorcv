# fly.toml app configuration file generated for tailorcv on 2025-12-08T15:53:57Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'tailorcv'
primary_region = 'iad'

[build]

[env]
  # Cap Node.js heap at 75% of container RAM (512MB) so V8 GCs before the OS OOM-killer fires
  NODE_OPTIONS = "--max-old-space-size=384"

[processes]
  app = ""
  worker = "node dist/src/worker-runner.js"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory_mb = 512
  cpu_kind = 'shared'
  cpus = 1

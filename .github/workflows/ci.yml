name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: "postgresql://postgres:password@localhost:5432/tailorcv"
  DIRECT_URL: "postgresql://postgres:password@localhost:5432/tailorcv"
  SHADOW_DATABASE_URL: "postgresql://postgres:password@localhost:5432/tailorcv_shadow"
  REDIS_URL: "redis://localhost:6380"
  CLERK_SECRET_KEY: "sk_test_1234567890abcdefghijklmnopqrstuvwxyz1234567890"
  CLERK_PUBLISHABLE_KEY: "pk_test_1234567890abcdefghijklmnopqrstuvwxyz1234567890"
  CLERK_WEBHOOK_SECRET: "whsec_1234567890abcdefghijklmnopqrstuvwxyz1234567890"
  OPENAI_ONBOARDING_SYSTEM_PROMPT: "mock_system_prompt"
  OPENAI_API_KEY: "sk-1234567890abcdefghijklmnopqrstuvwxyz1234567890"
  GITHUB_APP_SLUG: "mock-tailorcv-app"
  GITHUB_APP_ID: "123456"
  GITHUB_APP_CLIENT_ID: "mock_github_app_client_id"
  GITHUB_APP_CLIENT_SECRET: "mock_github_app_client_secret"
  GITHUB_APP_CALLBACK_URL: "http://localhost:8080/api/v1/auth/github/callback"
  GITHUB_APP_PRIVATE_KEY: "mock_github_app_private_key"
  NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: "pk_test_1234567890abcdefghijklmnopqrstuvwxyz1234567890"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run lint
      - run: npm run test
      - run: npm run build

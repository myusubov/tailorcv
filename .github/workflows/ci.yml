name: Trust Engine CI (Integrity Guard)

on:
  push:
    branches: [main, dev, feature/*]
  pull_request:
    branches: [main, dev]

jobs:
  # 1. Integrity Check: Linting & Type Validation
  integrity:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Lint Check
        run: npm run lint

      - name: Type Check (Global)
        run: npm run build # Ensures all type-checking passes during compilation

  # 2. Sovereignty Audit: Docker Build Verification
  docker-audit:
    name: Docker Build Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Audit Backend Build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: false

      - name: Audit Frontend Build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/frontend/Dockerfile
          push: false

  # 3. Mathematical Verification: Unit Tests
  test:
    name: Unit Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Unit Tests
        run: npm run test
